<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Your share of the bill</title>
  <script>
    // Same theme as the app (saved in its settings)
    try {
      var t = (JSON.parse(localStorage.getItem("spliteasy:v1")) || {}).theme;
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <!-- Link preview card in chat apps. %PUBLIC_URL% is filled in at build time (vite.config.js) because
       crawlers need an absolute image URL. The split itself is in the #hash, which crawlers never see. -->
  <meta property="og:site_name" content="SplitEasy" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Your share of the bill" />
  <meta property="og:description" content="See the full bill and pay" />
  <meta property="og:image" content="%PUBLIC_URL%og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root { --bg: #f3f4f6; --card: #fff; --text: #111; --muted: #6b7280; --accent: #6366f1; --line: #e5e7eb; }
    /* Dark when the system asks (unless light was picked in the app), or when dark was picked */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #111318; --card: #1c1f26; --text: #f3f4f6; --muted: #9ca3af; --line: #2d313a; }
    }
    :root[data-theme="dark"] { --bg: #111318; --card: #1c1f26; --text: #f3f4f6; --muted: #9ca3af; --line: #2d313a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 16px;
      background: var(--bg); color: var(--text); font-family: -apple-system, "Inter", system-ui, sans-serif; }
    .card { width: 100%; max-width: 380px; background: var(--card); border-radius: 20px; padding: 28px 24px; text-align: center;
      box-shadow: 0 4px 32px #0001; }
    .label { color: var(--muted); font-size: 14px; }
    .amount { font-size: 40px; font-weight: 800; margin: 6px 0 4px; }
    .to { font-size: 15px; margin-bottom: 4px; }
    .note { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .pay { display: block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 16px;
      border-radius: 12px; padding: 14px; }
    .id { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; font-size: 13px; color: var(--muted); }
    .id code { display: block; font-size: 15px; color: var(--text); margin: 6px 0 10px; word-break: break-all; }
    button { font: inherit; background: none; border: 1.5px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
    .error { color: #ef4444; }
    .items { list-style: none; padding: 0; margin: 0 0 24px; text-align: left; border-top: 1px solid var(--line); }
    .items li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .items li span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hint { color: var(--muted); font-size: 13px; margin: 0; }
    .gpay { background: #1a73e8; margin-bottom: 10px; }
    .pay.small { display: inline-block; font-size: 13px; padding: 6px 12px; border-radius: 8px; margin-top: 8px; }
    .toggle { width: 100%; margin-top: 16px; font-weight: 600; font-size: 14px; color: var(--accent); }
    .split { margin-top: 16px; text-align: left; }
    .split .sum { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 8px; }
    .person { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .person:last-child { border-bottom: none; }
    .person .row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600; }
    .person .row span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .person .tag { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 6px; }
    .person .tag.ok { color: #16a34a; }
    .person .lines { color: var(--muted); font-size: 12px; margin-top: 2px; }
    /* App header, as in SplitEasy: logo and name (opens the app), and a link to saved requests */
    .top { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top)) 8px 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; color: var(--text); text-decoration: none; }
    .brand img { width: 28px; height: 28px; }
    .icons { display: flex; gap: 2px; }
    .top .icon { display: flex; padding: 6px; border: none; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
    .card { margin: auto 0; }
    .icon .sun { display: none; }
    :root[data-theme="dark"] .icon .sun { display: inline; }
    :root[data-theme="dark"] .icon .moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .icon .sun { display: inline; }
      :root:not([data-theme]) .icon .moon { display: none; }
    }
    .mark { width: 100%; margin-top: 10px; font-weight: 600; font-size: 14px; }
    .paid-note { margin-top: 4px; font-size: 14px; font-weight: 600; color: #16a34a; }
    .paid-note button { border: none; padding: 0 0 0 6px; font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: underline; }
    .pick { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .pick-label { width: 100%; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
    .pick button { font-size: 14px; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><img src="pizza.svg" alt="" />SplitEasy</a>
    <div class="icons">
      <button class="icon" id="theme" type="button" aria-label="Switch theme" title="Switch theme">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path class="moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          <g class="sun"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></g>
        </svg>
      </button>
      <a class="icon" href="./?tab=requests#/history" aria-label="Saved requests" title="Saved requests">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
      </a>
      <a class="icon" href="./#/settings" aria-label="Settings" title="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
      </a>
    </div>
  </header>
  <main class="card" id="card">
    <div class="label" id="label">Payment request</div>
    <div class="amount" id="amount"></div>
    <div class="to" id="to"></div>
    <div class="note" id="note"></div>
    <ul class="items" id="items" hidden></ul>
    <a class="pay gpay" id="gpay" hidden>Pay with Google Pay</a>
    <a class="pay" id="pay" hidden>Pay with UPI app</a>
    <div class="id" id="upibox" hidden>
      Or pay manually to this UPI ID
      <code id="upi"></code>
      <button id="copy" type="button">Copy UPI ID</button>
    </div>
    <button class="toggle" id="toggle" type="button" hidden>View full split</button>
    <div class="split" id="split" hidden></div>
  </main>
  <script>
    (function () {
      var UPI = /^[a-zA-Z0-9._-]{2,256}@[a-zA-Z][a-zA-Z0-9.-]{1,63}$/;
      var card = document.getElementById("card");
      var $ = function (id) { return document.getElementById(id); };
      var el = function (tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      };

      function fail() {
        card.textContent = "";
        card.appendChild(el("p", "error", "This payment link is invalid or incomplete."));
      }

      // Packed split in the hash (see packSplit in src/payment.js)
      function unpack(hash) {
        // Use only the leading base64 run: pasting a multi-line message into the address bar can glue
        // whatever followed the link (e.g. "upi://pay?...") onto the hash
        var b64 = (decodeURIComponent(hash).match(/^[A-Za-z0-9+\/_-]+/) || [""])[0].replace(/-/g, "+").replace(/_/g, "/");
        var bin = atob(b64 + "===".slice((b64.length + 3) % 4));
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var f = new TextDecoder().decode(bytes).split("\x1e");
        if (f[0] !== "2" || !f[6]) throw new Error("bad");
        var list = function (v) { return v ? v.split("\x1d").map(function (e) { return e.split("\x1f"); }) : []; };
        var names = f[6].split("\x1d");
        var everyone = Math.pow(2, names.length) - 1;
        return {
          note: f[1] ? f[1] + " bill" : "", c: (f[2] || "₹").slice(0, 4), payee: f[3] || names[0],
          upi: f[4] || "", me: f[5] === "-" ? -1 : Number(f[5]) || 0, names: names,
          items: list(f[7]).map(function (e) {
            return [e[0], e[1], e[2] ? parseInt(e[2], 36) : everyone, e[3] ? e[3].split(".").map(function (x) { return parseInt(x, 36) || 0; }) : null];
          }),
          taxes: list(f[8]), paid: f[9] ? parseInt(f[9], 36) : 0, byItems: f[10] === "p", roundOff: f[11] === "1"
        };
      }

      // Same rules as computeTotals: items split among the people on them, shared charges split among
      // everyone equally, or in proportion to each person's items when the link says so
      function shares(s) {
        var n = s.names.length || 1;
        var taxTotal = s.taxes.reduce(function (t, x) { return t + (Number(x[1]) || 0); }, 0);
        var taxNames = s.taxes.map(function (x) { return String(x[0]); }).join(", ");
        var people = s.names.map(function (name, i) {
          var lines = [], total = 0;
          s.items.forEach(function (it) {
            var m = Number(it[2]) || 0;
            if (!(m & (1 << i))) return;
            // Shares per masked person (in list order) when split unevenly, otherwise one each
            var mine = 1, all = 0, rank = 0;
            for (var k = 0; k < s.names.length; k++) {
              if (!(m & (1 << k))) continue;
              var w = it[3] ? it[3][rank] || 0 : 1;
              if (k === i) mine = w;
              all += w; rank++;
            }
            var amt = all ? (Number(it[1]) || 0) * mine / all : 0;
            total += amt;
            lines.push([String(it[0]) + (it[3] && mine > 1 ? " ×" + mine : ""), amt]);
          });
          return { name: name, total: total, lines: lines, paid: !!(s.paid & (1 << i)) };
        });
        var itemsSum = people.reduce(function (t, p) { return t + p.total; }, 0);
        // Round-off: the whole bill to the nearest unit, the difference shared like the charges
        if (s.roundOff) {
          var raw = s.items.reduce(function (t, it) { return t + (Number(it[1]) || 0); }, 0) + taxTotal;
          var adj = Math.round((Math.round(raw) - raw) * 100) / 100;
          if (adj) { taxTotal += adj; taxNames = taxNames ? taxNames + ", Round off" : "Round off"; }
        }
        people.forEach(function (p) {
          if (!taxTotal) return;
          var part = s.byItems && itemsSum > 0 ? taxTotal * p.total / itemsSum : taxTotal / n;
          p.total += part;
          p.lines.push(["Shared charges (" + taxNames + ")", part]);
        });
        return people;
      }

      function money(c, n) { return c + n.toFixed(2); }

      // Saved requests (shown in the app under History > Requests). Each opened link is kept, newest first,
      // with whether the reader marked their own share paid (on a group link, also which person they are: me)
      var REQ_KEY = "spliteasy:requests";
      var HASH = location.hash.slice(1);
      function loadReqs() { try { return JSON.parse(localStorage.getItem(REQ_KEY) || "[]"); } catch (e) { return []; } }
      function saveReqs(list) { try { localStorage.setItem(REQ_KEY, JSON.stringify(list.slice(0, 50))); } catch (e) { /* storage unavailable */ } }
      function myReq() { return loadReqs().filter(function (x) { return x.id === HASH; })[0] || {}; }
      function remember(r) {
        var list = loadReqs(), old = list.filter(function (x) { return x.id === HASH; })[0] || {};
        r.id = HASH; r.savedAt = Date.now(); r.paid = old.paid;
        if (r.group) { r.me = old.me; r.who = old.who; r.share = old.share; }
        saveReqs([r].concat(list.filter(function (x) { return x.id !== HASH; })));
      }
      function patchReq(patch) {
        saveReqs(loadReqs().map(function (x) {
          if (x.id !== HASH) return x;
          for (var k in patch) x[k] = patch[k];
          return x;
        }));
      }

      // UPI only when a valid ID was sent and the bill is in rupees
      function hasUpi(v) { return v.c === "₹" && UPI.test(v.upi); }
      function upiHref(v, amount) {
        var params = new URLSearchParams({ pa: v.upi, pn: v.payee, am: amount.toFixed(2), cu: "INR" });
        if (v.note) params.set("tn", v.note.slice(0, 50));
        return "upi://pay?" + params.toString();
      }
      // Same payment, opened straight in Google Pay instead of the UPI app picker.
      // Android: intent pinned to GPay's package. iOS: GPay's own scheme. Elsewhere: none.
      function gpayHref(upi) {
        var ua = navigator.userAgent, query = upi.slice(upi.indexOf("?"));
        if (/Android/i.test(ua)) return "intent://pay" + query + "#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end";
        if (/iPhone|iPad|iPod/i.test(ua)) return "gpay://upi/pay" + query;
        return "";
      }
      function showUpiId(v) {
        $("upibox").hidden = false;
        $("upi").textContent = v.upi;
        $("copy").addEventListener("click", function (e) {
          navigator.clipboard.writeText(v.upi).then(function () { e.target.textContent = "Copied"; });
        });
      }
      function settleHint(v) {
        card.insertBefore(el("p", "hint", v.payee ? "Settle up with " + v.payee + " directly." : "Settle up with the person who paid."), $("toggle"));
      }

      function render(v) {
        // Name whose share this is rather than assuming the reader: group links get opened by anyone
        if (v.who) $("label").textContent = v.who + "\u2019s share";
        $("amount").textContent = money(v.c, v.amount);
        $("to").textContent = v.payee ? "to " + v.payee : "";
        $("note").textContent = v.note;

        var list = $("items");
        v.lines.forEach(function (l) {
          var li = el("li");
          li.appendChild(el("span", null, l[0]));
          li.appendChild(el("span", null, isNaN(l[1]) ? "" : money(v.c, l[1])));
          list.appendChild(li);
        });
        if (list.children.length) list.hidden = false;

        if (hasUpi(v)) {
          $("pay").href = upiHref(v, v.amount);
          $("pay").hidden = false;
          var gpay = gpayHref($("pay").href);
          if (gpay) { $("gpay").href = gpay; $("gpay").hidden = false; }
          showUpiId(v);
        } else settleHint(v);

        // Mark as paid, to keep track in the app; once paid the pay options step aside
        var mark = el("button", "mark", "Mark as paid"), note = el("div", "paid-note");
        mark.type = "button";
        card.insertBefore(mark, $("toggle"));
        card.insertBefore(note, $("toggle"));
        function paintPaid() {
          var byPayer = v.everyone && v.everyone[v.me] && v.everyone[v.me].paid, mine = !!myReq().paid, paid = byPayer || mine;
          mark.hidden = paid;
          note.hidden = !paid;
          note.textContent = byPayer ? "\u2713 Marked paid by " + (v.payee || "the payer") : "\u2713 You marked your share paid";
          if (mine && !byPayer) {
            var undo = el("button", null, "Undo");
            undo.type = "button";
            undo.addEventListener("click", function () { patchReq({ paid: false }); paintPaid(); });
            note.appendChild(undo);
          }
          ["gpay", "pay", "upibox"].forEach(function (id) { if (hasUpi(v) && (id !== "gpay" || $("gpay").href)) $(id).hidden = paid; });
          var hint = card.querySelector(".hint");
          if (hint) hint.hidden = paid;
        }
        mark.addEventListener("click", function () { patchReq({ paid: true }); paintPaid(); });
        paintPaid();

        if (v.everyone) renderSplit(v, false);
      }

      // Group link: the whole bill with everyone's share open, and a pay button per person still owing
      function renderGroup(v) {
        var billTotal = v.everyone.reduce(function (t, p) { return t + p.total; }, 0);
        $("label").textContent = v.note || "Bill split";
        $("amount").textContent = money(v.c, billTotal);
        $("to").textContent = "paid by " + v.everyone[0].name;
        if (hasUpi(v)) showUpiId(v); else settleHint(v);
        renderSplit(v, true);
        // "Or pay manually" reads right only after the per-person pay buttons
        card.appendChild($("upibox"));
        groupPaid(v);
      }

      // Same Mark as paid as on a personal link; on a group link it first asks which person the reader is
      function groupPaid(v) {
        var people = v.everyone.map(function (p, i) { return { p: p, i: i }; }).filter(function (x) { return x.i > 0 && !x.p.paid; });
        var mark = el("button", "mark", "Mark as paid"), pick = el("div", "pick"), note = el("div", "paid-note");
        mark.type = "button";
        pick.hidden = true;
        [mark, pick, note].forEach(function (n) { card.appendChild(n); });
        function choose(x) {
          patchReq({ paid: true, me: x.i, who: x.p.name, share: Math.round(x.p.total * 100) / 100 });
          refresh();
        }
        function refresh() {
          var req = myReq(), mine = req.paid && req.me != null;
          $("split").textContent = "";
          renderSplit(v, true);
          pick.hidden = true;
          mark.hidden = mine || !people.length;
          note.hidden = !mine;
          note.textContent = mine ? "\u2713 You marked your share paid (" + req.who + ")" : "";
          if (mine) {
            var undo = el("button", null, "Undo");
            undo.type = "button";
            undo.addEventListener("click", function () { patchReq({ paid: false, me: undefined, who: undefined, share: undefined }); refresh(); });
            note.appendChild(undo);
          }
        }
        mark.addEventListener("click", function () {
          if (people.length === 1) return choose(people[0]);
          pick.textContent = "";
          pick.appendChild(el("div", "pick-label", "Which one are you?"));
          people.forEach(function (x) {
            var b = el("button", null, x.p.name + " \u00b7 " + money(v.c, x.p.total));
            b.type = "button";
            b.addEventListener("click", function () { choose(x); });
            pick.appendChild(b);
          });
          mark.hidden = true;
          pick.hidden = false;
        });
        refresh();
      }

      function renderSplit(v, open) {
        var box = $("split"), toggle = $("toggle");
        var billTotal = v.everyone.reduce(function (t, p) { return t + p.total; }, 0);
        if (!open) box.appendChild(el("div", "sum", "Bill " + money(v.c, billTotal) + " · " + v.everyone.length + " people"));
        v.everyone.forEach(function (p, i) {
          var row = el("div", "person");
          var top = el("div", "row");
          var who = el("span", null, p.name);
          if (i === 0) who.appendChild(el("span", "tag", "payer"));
          else if (p.paid) who.appendChild(el("span", "tag ok", "✓ paid"));
          top.appendChild(who);
          top.appendChild(el("span", null, money(v.c, p.total)));
          row.appendChild(top);
          if (p.lines.length) row.appendChild(el("div", "lines", p.lines.map(function (l) { return l[0] + " " + money(v.c, l[1]); }).join(" · ")));
          // The reader's own row once they marked themselves paid (see groupPaid)
          var req = open ? myReq() : {}, isMe = req.paid && req.me === i;
          if (isMe) who.appendChild(el("span", "tag ok", "\u2713 you paid"));
          if (open && i > 0 && !p.paid && !isMe && hasUpi(v)) {
            var btn = el("a", "pay small", "Pay " + money(v.c, p.total) + " with UPI");
            btn.href = upiHref(v, Math.round(p.total * 100) / 100);
            row.appendChild(btn);
          }
          box.appendChild(row);
        });
        if (open) { box.hidden = false; return; }
        toggle.hidden = false;
        toggle.addEventListener("click", function () {
          box.hidden = !box.hidden;
          toggle.textContent = box.hidden ? "View full split" : "Hide full split";
        });
      }

      // Changing only the hash keeps the same document, so re-run from scratch for the new link
      window.addEventListener("hashchange", function () { location.reload(); });

      // Theme switch, as in the app's header: flips light/dark and saves the choice for the app too
      $("theme").addEventListener("click", function () {
        var root = document.documentElement, cur = root.getAttribute("data-theme");
        var dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        var next = dark ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try {
          var saved = JSON.parse(localStorage.getItem("spliteasy:v1")) || {};
          saved.theme = next;
          localStorage.setItem("spliteasy:v1", JSON.stringify(saved));
        } catch (e) { /* storage unavailable */ }
      });

      // Every opened request is kept on this device, so it can be found again in the app (History > Requests)

      var hash = HASH;
      if (hash) {
        try {
          var s = unpack(hash);
          var everyone = shares(s);
          var billTotal = everyone.reduce(function (t, p) { return t + p.total; }, 0);
          if (s.me === -1) {
            remember({ title: s.note || "Bill split", c: s.c, amount: Math.round(billTotal * 100) / 100, group: true, payee: everyone[0].name });
            renderGroup({ c: s.c, payee: s.payee, note: s.note, upi: s.upi, everyone: everyone });
            return;
          }
          var mine = everyone[s.me];
          if (!mine) throw new Error("bad");
          remember({ title: s.note || "Bill split", c: s.c, amount: Math.round(mine.total * 100) / 100, who: mine.name, payee: s.payee, paidByPayer: mine.paid });
          render({
            c: s.c, payee: s.payee, note: s.note, upi: s.upi, me: s.me, who: mine.name,
            amount: Math.round(mine.total * 100) / 100, lines: mine.lines, everyone: everyone
          });
        } catch (e) { console.error(e); fail(); }
        return;
      }

      // Older links carried one person's share in the query string
      var q = new URLSearchParams(location.search);
      var am = q.get("am") || "";
      if (!/^\d+(\.\d{1,2})?$/.test(am)) return fail();
      render({
        c: (q.get("c") || "₹").slice(0, 4), payee: q.get("pn") || "", note: q.get("tn") || "", upi: q.get("pa") || "",
        amount: Number(am),
        lines: q.getAll("i").map(function (raw) {
          var cut = raw.lastIndexOf("|");
          return cut > 0 ? [raw.slice(0, cut), Number(raw.slice(cut + 1))] : [raw, NaN];
        })
      });
    })();
  </script>
</body>
</html>
